aid: ejen2u
name: Ejen2u
description: >-
  Ejen2u is a Malaysian reseller and agent-management technology company that
  operates one of the country's largest cloud-based reseller ecosystems for
  MSME brand owners, stockists, agents, dropshippers, and affiliates. Its
  platform spans EjenGO, a digital reseller and stockist management system;
  WEMAP, an entrepreneurial education program; and EjenVenture, custom
  reseller-network solutions for corporate brands, alongside fintech and
  logistics integrations (Pos Laju, Boost, Curlec, Delyva, J&T). Founded in
  2019 and headquartered in Seri Kembangan, Ejen2u is backed by 500 Global,
  Gobi Partners, and Artem Ventures, and has facilitated hundreds of millions
  of ringgit in reseller commerce across a network of hundreds of thousands of
  agents. It exposes no public developer API today; this profile is an API
  Evangelist network entry enriched from public sources.
